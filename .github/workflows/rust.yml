name: CI & Release

# The only workflow of this repository, one run per push:
#
#   every push, every PR   test -> build-matrix
#   push of a tag          ... and then: release   (GitHub Release, what "gits --update" downloads)
#
# Nothing is published when tests fail.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

# nothing by default, every job asks for what it needs
permissions:
  contents: read

# Every job is stopped after 3 minutes (timeout-minutes of each job): a run can never burn
# more than that per job, whatever hangs. A newer push to the same branch cancels the run
# of the older one. Tags are never cancelled: each one is a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Test on Linux x64
    runs-on: ubuntu-latest
    # a test which hangs must not burn minutes: the whole job is stopped
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # tests/test007 and tests/test011 (encryption) talk to the real encoder process of submodules/encrypt.
      # Only that one submodule is fetched. Its url in .gitmodules is ssh (git@github.com:...),
      # there is no ssh key here and the repository is public: https is used instead.
      - name: Checkout submodule submodules/encrypt
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 submodules/encrypt
          git submodule status submodules/encrypt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # the encoder process: node submodules/encrypt/examples/socket/server.ts
      # (TypeScript executed by Node directly, needs Node.js >= 22.18)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # zsh: GITS_SHELL is tested with bash and with zsh
      # nc:  tests/encoder/encoder-start.sh asks the socket with it whether the encoder process answers
      # (python3, which tests/test014 needs for tests/terminal.py, is already on the runner)
      - name: Install zsh and nc
        run: sudo apt-get update && sudo apt-get install -y zsh netcat-openbsd

      # compiled crates of the previous run (gits and ssenc of the submodule): without it most of
      # the time of this job is compiling
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            submodules/encrypt/rust

      - name: Compile binary
        run: /bin/bash compile.sh

      # submodules/encrypt/rust/target/release/ssenc: tests/test007 and tests/test011 open with it the files gits stored.
      # (the test would compile it by itself, here it is a step of its own to see its output)
      - name: Compile ssenc binary of submodules/encrypt
        run: /bin/bash submodules/encrypt/rust/compile.sh

      # ssh-keygen, ssh-agent, ssh-add: demo key and private agent of tests/test007 and tests/test011
      - name: Check ssh tools
        run: |
          command -v ssh-keygen ssh-agent ssh-add
          ssh -V

      # the step which can hang (a process waiting for something which never comes)
      - name: Run unit and E2E tests
        timeout-minutes: 3
        run: /bin/bash test.sh

  build-matrix:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    strategy:
      matrix:
        # artifact_name: the same names src/update.rs looks for (fn asset)
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: gits-darwin-arm64
            use_cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: gits-linux-x64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: gits-linux-arm64
            use_cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # compiled crates of the previous run: the build is the slow part of this job
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # a prebuilt binary: "cargo install cross" compiles it for minutes
      - name: Install cross (if required)
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # Version is embedded only when a tag is built. Everything else is "dev",
      # and a "dev" binary refuses to --update.
      - name: Build binary
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            export GITS_VERSION="${{ github.ref_name }}"
          fi
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            # GITS_VERSION reaches the container thanks to Cross.toml
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
          mkdir -p dist
          cp target/${{ matrix.target }}/release/gits dist/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Publish Release
    needs: build-matrix
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      # needed for changelog.md and bash/release_notes.sh
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      # bare binaries + SHA256SUMS.txt: the shape "gits --update" expects from every release
      - name: Prepare release files and checksums
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -exec cp {} release-dist/ \;
          cd release-dist
          shasum -a 256 gits-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          /bin/bash bash/release_notes.sh "${{ github.ref_name }}" "${{ github.repository }}" release-dist > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          body_path: release_notes.md
          files: |
            release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
